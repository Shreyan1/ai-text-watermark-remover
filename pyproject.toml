[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name is the discoverable one; the import package stays `reweave`
# (the pip-install-X / import-Y split is idiomatic — cf. beautifulsoup4 → bs4).
name = "ai-text-watermark-remover"
version = "0.1.0"
description = "Remove AI text watermarks (SynthID-Text, KGW, Unigram) by regenerating text from its meaning — scheme-blind, measured, local-only."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = [
  "ai-text-watermark-remover", "watermark-removal", "synthid", "synthid-text",
  "ai-detection", "text-humanizer", "llm", "kgw-watermark", "paraphrase",
  "claude-watermark", "provenance",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Text Processing :: Linguistic",
]

# The STABLE CORE has ZERO runtime dependencies, on purpose (Invariant I3):
# a dependency-free core cannot rot against an upstream release.
dependencies = []

[project.optional-dependencies]
# Each edge stage pulls only what it needs. Nothing here touches the core.
score = ["transformers>=4.40", "torch>=2.2", "tokenizers>=0.19"]
guard = ["sentence-transformers>=3.0"]
regenerate = ["llama-cpp-python>=0.2.90"]
# The self-watermark ground-truth harness (tests/harness): open watermark impls.
harness = ["markllm>=0.1"]
# Optional trained NLI cross-encoder for the fact gate. NOT required: the
# shipped backend prompts a local Ollama model and needs no Python deps at all.
verify = ["transformers>=4.40", "torch>=2.2"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]
all = [
  "ai-text-watermark-remover[score,guard,regenerate,harness,verify,dev]",
]

[project.scripts]
reweave = "reweave.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
